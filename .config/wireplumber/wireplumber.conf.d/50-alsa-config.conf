monitor.alsa.rules = [
  # Specific rules for KTMicro Chu2 DSP USB headphones
  {
    matches = [
      {
        node.name = "~alsa_output.usb-KTMicro_Chu2_DSP*"
      }
      {
        node.name = "~alsa_input.usb-KTMicro_Chu2_DSP*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        api.alsa.period-size   = 1024
        api.alsa.period-num    = 4
        api.alsa.headroom      = 1024
      }
    }
  },
  # Rules for all other ALSA outputs (like Built-in Audio PCI)
  {
    matches = [
      {
        node.name = "~alsa_output.pci.*"
      }
      {
        node.name = "~alsa_input.pci.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        api.alsa.period-size   = 512
        api.alsa.period-num    = 4
        api.alsa.headroom      = 512
      }
    }
  }
]
