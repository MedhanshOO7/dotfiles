# snd-aloop is loaded for DroidCam's virtual microphone (/etc/modules-load.d/droidcam.conf).
# Its *playback* side showed up as a "Loopback Analog Stereo" speaker and became the
# fallback default output whenever the Chu II DSP was unplugged, so audio went nowhere.
# Disable only that sink; the capture side (DroidCam mic) is untouched.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-snd_aloop.*" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
