# GTK 4.24 binds ext-background-effect on every surface, and Hyprland then ignores the
# swaync layer rules and blurs only the region GTK sends. swaync 0.12.6 never sends one
# for popup notifications (opacity nodes, upstream PR #778), so they never blurred.
# Without the protocol, Hyprland's layer rules (blur + ignore_alpha) blur the cards.
[Service]
Environment=GDK_WAYLAND_DISABLE=ext_background_effect_manager_v1
