[general]
bars = 14
autosens = 1
sensitivity = 100
lower_cutoff_freq = 50
higher_cutoff_freq = 10000
sleep_timer = 5

[input]
method = pipewire
source = auto
sample_rate = 44100
sample_bits = 16

[output]
method = raw
orientation = bottom
stereo = true
reverse = false
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 0

[smoothing]
noise_reduction = 77
