# Colors + wallpaper come from matugen (~/.config/hypr/hyprlock/colors.conf),
# so the lock screen follows whatever theme the wallpaper generated.
# Styled to the HUD design system (~/.config/hud/tokens.css): Orbitron display
# type, GeistMono UI type, 12px radii, primary edges.
source = ~/.config/hypr/hyprlock/colors.conf

$scripts    = ~/.config/hypr/hyprlock
$clock_font = Orbitron
$ui_font    = GeistMono Nerd Font Propo
$avatar     = /var/lib/AccountsService/icons/medhansh

$glass        = $hud_glass
$glass_border = $hud_edge
$shadow       = rgba(00000080)

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

animations {
    enabled = true
    bezier = smooth, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 5, smooth
    animation = fadeOut, 1, 4, smooth
    animation = inputFieldDots, 1, 2, smooth
    animation = inputFieldColors, 1, 3, smooth
    animation = inputFieldWidth, 1, 3, smooth
}

background {
    monitor =
    path = $background_image
    color = rgba(0c0c10ff)
    blur_size = 8
    blur_passes = 3
    noise = 0.015
    brightness = 0.5
    contrast = 1.05
    vibrancy = 0.25
    vibrancy_darkness = 0.1
}

# ─── Date ────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='4096'>$(date +'%A  //  %d %B' | tr a-z A-Z)</span>"
    color = $hud_accent
    font_size = 16
    font_family = $clock_font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow
    position = 0, 445
    halign = center
    valign = center
}

# ─── Clock (stacked, two-tone) ───────────────────────────
label { # hours
    monitor =
    text = cmd[update:1000] date +%H
    color = $hud_accent
    font_size = 200
    font_family = $clock_font
    shadow_passes = 3
    shadow_size = 8
    shadow_color = $shadow
    position = 0, 260
    halign = center
    valign = center
}

label { # minutes
    monitor =
    text = cmd[update:1000] echo "<span alpha='55%'>$(date +%M)</span>"
    color = $text_color
    font_size = 200
    font_family = $clock_font
    shadow_passes = 3
    shadow_size = 8
    shadow_color = $shadow
    position = 0, 75
    halign = center
    valign = center
}

# ─── User ────────────────────────────────────────────────
image {
    monitor =
    path = $avatar
    size = 100
    rounding = 12
    border_size = 2
    border_color = $hud_edge
    position = 0, -105
    halign = center
    valign = center
}

label { # greeting
    monitor =
    text = cmd[update:60000] $scripts/greeting.sh
    color = $text_color
    font_size = 24
    font_family = $ui_font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow
    position = 0, -190
    halign = center
    valign = center
}

# ─── Password ────────────────────────────────────────────
input-field {
    monitor =
    size = 480, 72
    rounding = 12
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.45
    dots_center = true
    dots_rounding = 2

    outer_color = $glass_border
    inner_color = $glass
    font_color = $entry_color
    font_family = $ui_font
    check_color = $hud_accent
    fail_color = $hud_danger
    capslock_color = rgba(f5c56bff)

    fade_on_empty = false
    placeholder_text = <span alpha="65%">  ENTER PASSPHRASE</span>
    fail_text = <b>$FAIL</b>  <span alpha="70%">· $ATTEMPTS</span>
    fail_timeout = 2000

    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(00000055)

    position = 0, -290
    halign = center
    valign = center
}

# ─── Now playing (top-left, hidden unless playing) ───────
image { # album art
    monitor =
    path = /home/medhansh/.cache/hyprlock/blank.png
    reload_time = 2
    reload_cmd = $scripts/music-art.sh
    size = 96
    rounding = 10
    border_size = 0
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $shadow
    position = 40, -40
    halign = left
    valign = top
}

label { # title / artist
    monitor =
    text = cmd[update:2000] $scripts/music.sh
    color = $text_color
    font_size = 16
    font_family = $ui_font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow
    position = 156, -46
    halign = left
    valign = top
}

# ─── Bottom pills ────────────────────────────────────────
shape { # battery pill
    monitor =
    size = 150, 52
    color = $glass
    rounding = 10
    border_size = 1
    border_color = $glass_border
    position = 32, 32
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:30000] $scripts/battery.sh
    color = $text_color
    font_size = 15
    font_family = $ui_font
    position = 56, 48
    halign = left
    valign = bottom
}

shape { # wifi pill
    monitor =
    size = 260, 52
    color = $glass
    rounding = 10
    border_size = 1
    border_color = $glass_border
    position = -32, 32
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:30000] $scripts/wifi.sh
    color = $text_color
    font_size = 15
    font_family = $ui_font
    position = -56, 48
    halign = right
    valign = bottom
}

label { # keyboard layout
    monitor =
    text = 󰌌  $LAYOUT
    color = $text_color
    font_size = 14
    font_family = $ui_font
    position = 0, 48
    halign = center
    valign = bottom
}
