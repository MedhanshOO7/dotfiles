# hyprsunset — warms the screen in the evening, back to normal in the morning.
# Toggle manually:  hyprctl hyprsunset temperature 4000   /   hyprctl hyprsunset identity

max-gamma = 150

profile { # daytime: no filter
    time = 6:30
    identity = true
}

profile { # sunset: gentle warm tint
    time = 19:00
    temperature = 5000
}

profile { # late night: warmer, slightly dimmer
    time = 22:30
    temperature = 4000
    gamma = 0.9
}
